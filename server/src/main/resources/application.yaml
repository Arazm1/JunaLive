spring:
  jpa:
    properties:
      hibernate:
        show_sql: true
        format_sql: true
        ddl-auto: validate
  mvc:
    format:
      date: iso

  application:
    name: demo

  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3306/junalive}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}